pipelineInfo:
  description: Compare retry behavior for a mocked LLM evaluation endpoint.
  name: retry-safe-llm-evaluation
root:
  dag:
    tasks:
      evaluate-once:
        cachingOptions: {}
        componentRef:
          name: comp-evaluate-once
        inputs:
          parameters:
            base_url:
              componentInputParameter: base_url
            experiment_id:
              componentInputParameter: experiment_id
            prompt:
              componentInputParameter: prompt
            strategy:
              runtimeValue:
                constant: naive
        retryPolicy:
          backoffDuration: 0s
          backoffFactor: 2.0
          backoffMaxDuration: 3600s
          maxRetryCount: 1
        taskInfo:
          name: naive
      evaluate-once-2:
        cachingOptions: {}
        componentRef:
          name: comp-evaluate-once-2
        inputs:
          parameters:
            base_url:
              componentInputParameter: base_url
            experiment_id:
              componentInputParameter: experiment_id
            prompt:
              componentInputParameter: prompt
            strategy:
              runtimeValue:
                constant: saved-result
        retryPolicy:
          backoffDuration: 0s
          backoffFactor: 2.0
          backoffMaxDuration: 3600s
          maxRetryCount: 1
        taskInfo:
          name: saved-result
      evaluate-once-3:
        cachingOptions: {}
        componentRef:
          name: comp-evaluate-once-3
        inputs:
          parameters:
            base_url:
              componentInputParameter: base_url
            experiment_id:
              componentInputParameter: experiment_id
            prompt:
              componentInputParameter: prompt
            strategy:
              runtimeValue:
                constant: idempotency-key
        retryPolicy:
          backoffDuration: 0s
          backoffFactor: 2.0
          backoffMaxDuration: 3600s
          maxRetryCount: 1
        taskInfo:
          name: idempotency-key
  inputDefinitions:
    parameters:
      base_url:
        parameterType: STRING
      experiment_id:
        parameterType: STRING
      prompt:
        defaultValue: 'Classify this review as positive or negative: ''The experience
          was excellent.'''
        isOptional: true
        parameterType: STRING
schemaVersion: 2.1.0
sdkVersion: kfp-2.17.0
